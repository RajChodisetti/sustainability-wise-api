name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ecoaudit/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm --prefix apps/ecoaudit ci

      - name: Verify contracts, tests, and builds
        run: npm run verify

