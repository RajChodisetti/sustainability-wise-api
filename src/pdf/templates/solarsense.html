<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5b6577;
        --line: #d8dee8;
        --soft: #f5f8f6;
        --green: #0f7b4f;
        --blue: #12394f;
        --amber: #b45309;
        --red: #b91c1c;
      }

      * { box-sizing: border-box; }
      body {
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11.5px;
        line-height: 1.45;
        margin: 0;
      }

      h1, h2, h3 { page-break-after: avoid; }
      h1 { color: var(--green); font-size: 28px; margin: 0 0 6px; }
      h2 { color: var(--blue); font-size: 18px; margin: 24px 0 10px; }
      h3 { color: var(--ink); font-size: 13px; margin: 16px 0 8px; }
      p { margin: 0 0 8px; }

      .cover {
        border-bottom: 4px solid var(--green);
        margin-bottom: 18px;
        padding-bottom: 14px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .meta { color: var(--muted); margin-bottom: 10px; }
      .summary-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(4, 1fr);
        margin: 14px 0 2px;
      }
      .summary-card {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
      }
      .summary-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .summary-value { font-size: 15px; font-weight: 800; margin-top: 2px; }

      table { border-collapse: collapse; margin: 8px 0 14px; width: 100%; }
      th, td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
      th { background: var(--soft); color: #334155; width: 34%; }

      .assessment {
        border-top: 2px solid var(--line);
        margin-top: 18px;
        padding-top: 12px;
        page-break-inside: avoid;
      }
      .badge {
        border-radius: 999px;
        display: inline-block;
        font-size: 9px;
        font-weight: 800;
        margin-left: 6px;
        padding: 3px 8px;
        text-transform: uppercase;
      }
      .badge.green { background: #dcfce7; color: #166534; }
      .badge.amber { background: #fef3c7; color: var(--amber); }
      .badge.red { background: #fee2e2; color: var(--red); }
      .badge.gray { background: #e5e7eb; color: #374151; }

      .photos {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, 1fr);
        margin-top: 10px;
      }
      figure {
        border: 1px solid var(--line);
        margin: 0;
        padding: 6px;
        page-break-inside: avoid;
      }
      img { display: block; max-height: 240px; object-fit: contain; width: 100%; }
      figcaption { color: var(--muted); font-size: 9.5px; margin-top: 4px; }
      .empty { color: var(--muted); font-style: italic; }
      .page-break { break-before: page; page-break-before: always; }
    </style>
  </head>
  <body>
    {{BODY}}
  </body>
</html>
